<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/*FONTFACES*/
:root { --ground:#2A0306; --main:#D95050; --second:#FFFFFF; --accent:#32B15D;
  --wine:color-mix(in srgb, var(--main) 38%, var(--ground)); --paper:#7A0C12; --lamp:#E8312F;
  --glow:#FF9A6B; --cap:color-mix(in srgb, var(--ground) 80%, var(--main));
  --card:color-mix(in srgb, var(--second) 88%, var(--main)); --ink:color-mix(in srgb, var(--ground) 90%, var(--second));
  --badge:color-mix(in srgb, var(--second) 92%, var(--main));
  --ui-font:"QuizUI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --han-font:"QuizHan","Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC","Songti SC",serif; }
html, body { margin:0; height:100%; background:#140103; overflow:hidden; font-family:var(--ui-font) }
#wrap { position:absolute; inset:0 0 64px 0; display:flex; align-items:center; justify-content:center }
body.capture #wrap { inset:0 }
#frame { position:relative; width:1080px; height:1920px; flex:none }
#stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; background:var(--ground); color:var(--second); font-family:var(--ui-font); font-weight:700; font-feature-settings:"palt" }
#bar { position:absolute; left:0; right:0; bottom:0; min-height:64px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:12px 18px; box-sizing:border-box; color:#f5e3e5; font:500 15px system-ui, sans-serif; background:#1e0204 }
body.capture #bar { display:none }
/* TikTok guides: where TikTok draws its own interface (preview only, never in the video) */
#guides { position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none; display:none; transform-origin:0 0; font:600 30px system-ui, sans-serif; color:#fff }
body.guides #guides { display:block } body.capture #guides { display:none !important }
/* Measured on an iPhone from the screenshot of the first upload (2026-11-07): TikTok fills the height of its screen
   with the video and cuts about 50 px off each side (the dark strips). The status bar and the tabs cover y 0-250, the
   buttons (profile, like, comment, save, share, sound) sit at x 900-1010 from y 865 down, the caption starts near y 1515
   (higher with a longer caption) and a search bar can cover the bottom 85 px. Short 16:9 phones (iPhone SE) cut the top
   and the bottom instead, with their tabs and caption in about the same place. The dashed line is the part nothing
   covers. */
#guides svg { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible }
.gt { fill:#fff; font:400 38px system-ui, -apple-system, sans-serif; text-anchor:middle }
.gt.b { font-weight:700 } .gt.m { fill:rgba(255,255,255,.72); font-size:42px; font-weight:600 } .gt.s { font-size:32px }
.gt.n { font-size:30px; font-weight:600 } .gt.l { text-anchor:start } .gt.r { text-anchor:end; font-weight:600 }
.gt.sh { paint-order:stroke; stroke:rgba(0,0,0,.45); stroke-width:6px }
#bar button { background:#3b0a0d; color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer }
#bar button:focus-visible, #bar input:focus-visible { outline:2px solid #32B15D; outline-offset:2px }
#bar input[type=range] { flex:1 1 120px; min-width:0; accent-color:#D95050 }
#time { font-variant-numeric:tabular-nums; min-width:92px; text-align:right }

.layer { position:absolute; inset:0 }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.qz-air { position:absolute; inset:0; background:radial-gradient(120% 70% at 50% 62%, var(--wine), var(--ground) 75%) }
.qz-photo { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; transform-origin:50% 40% }
/* on a busy photo the boxes need more body and the red bubble an outline */
#stage.photo .qz-ans { background:var(--band, color-mix(in srgb, var(--ground) 90%, transparent)) }
#stage.photo .qz-card { background:color-mix(in srgb, var(--card) 95%, transparent) }
/* the light ring is an outline: Safari draws a spread box-shadow next to a blurred one with square corners in the video */
#stage.photo .qz-bubble { box-shadow:0 20px 50px rgba(0,0,0,.5); outline:4px solid rgba(255,240,230,.55) }
#stage.photo .qz-followtxt { background:var(--band, color-mix(in srgb, var(--ground) 92%, transparent)) }
.qz-shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,2,4,.5) 0%, rgba(12,2,4,.3) 30%, rgba(12,2,4,.34) 70%, rgba(12,2,4,.62) 100%) }
.qz-vignette { position:absolute; inset:0; background:radial-gradient(90% 70% at 50% 50%, transparent 55%, color-mix(in srgb, var(--ground) 70%, transparent)) }
/* The quiz itself (badge, question, card or answers, follow card) is one group, laid out below in the full 1080 x 1920
   frame at x 72-918; the card, the answers and the follow card are 28 px narrower on each side (x 100-890).
   placeGroup() (layout "B", chosen 2026-11-07 after the first upload) shrinks it to GROUP_SCALE, centres it across the
   frame and puts its top (the badge) at GROUP_TOP, just under TikTok's tabs, so it stays clear of the tabs, TikTok's
   buttons (x 900 and more from y 865) and its caption (from about y 1515; see the guides). */
.qz-group { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:495px 148px; transform:translate(45px, 116px) scale(.86) }
.qz-ui { position:absolute; inset:0; display:none }
.qz-col { position:absolute; left:72px; right:162px; top:330px; display:flex; flex-direction:column; align-items:stretch }
.qz-bubble { position:relative; padding:44px 60px 50px; border-radius:46px; background:color-mix(in srgb, var(--main) 94%, transparent); text-align:center; font-size:58px; line-height:1.28; box-shadow:0 20px 50px rgba(0,0,0,.28); transform-origin:50% 100% }
.qz-bubble::after { content:''; position:absolute; left:50%; bottom:-30px; margin-left:-34px; border-left:34px solid transparent; border-right:34px solid transparent; border-top:32px solid color-mix(in srgb, var(--main) 94%, transparent) }
.qz-word { margin-top:52px; text-align:center; font-size:58px; text-shadow:0 2px 12px rgba(0,0,0,.4) }
.qz-card { position:relative; margin:30px 28px 0; height:560px; border-radius:46px; background:color-mix(in srgb, var(--card) 86%, transparent); box-shadow:0 24px 60px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center }
.qz-grid { display:flex }
.qz-cell { position:relative }
.qz-cell svg { position:absolute; inset:0; width:100%; height:100% }
.qz-han { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--han-font); font-weight:900; line-height:1; color:var(--ink) }
.qz-popwrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center }
.qz-pop { padding:40px 70px 30px; border-radius:40px; background:color-mix(in srgb, var(--ink) 58%, transparent); box-shadow:0 30px 70px rgba(0,0,0,.4); text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; max-width:740px }
.qz-pophan { font-size:96px; line-height:1.1 } .qz-poppin { font-size:76px; line-height:1.15 }
.qz-under { width:380px; height:30px; display:block }
.qz-answers { margin:190px 28px 0; display:flex; flex-direction:column; gap:40px } /* layout "A": a bit lower under the bubble */
/* --band, --bandline: set by tuneBands() from the background behind the answers */
.qz-ans { position:relative; padding:34px 110px; border-radius:36px; text-align:center; background:var(--band, color-mix(in srgb, var(--ground) 70%, transparent)); font-size:52px; line-height:1.2; box-shadow:0 14px 40px rgba(0,0,0,.25); outline:2px solid var(--bandline, transparent); outline-offset:-2px }
.qz-fill { position:absolute; inset:0; border-radius:36px; background:var(--accent); opacity:0 }
.qz-anstxt { position:relative }
.qz-check { position:absolute; right:44px; top:50%; width:64px; height:64px; margin-top:-32px }
.qz-badge { position:absolute; right:162px; top:148px; width:170px; height:170px }
.qz-badge svg { position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 8px 18px rgba(0,0,0,.3)) }
.qz-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:88px; color:var(--ink) }
.qz-follow { position:absolute; left:100px; right:190px; bottom:510px; display:flex; align-items:center; gap:28px; opacity:0 }
.qz-followtxt { flex:1; padding:30px 38px; border-radius:32px; background:var(--band, color-mix(in srgb, var(--ground) 86%, transparent)); outline:2px solid var(--bandline, transparent); outline-offset:-2px; font-size:44px; line-height:1.25 }
.qz-logo { width:240px; height:240px; border-radius:50%; flex:none; object-fit:cover; box-shadow:0 14px 36px rgba(0,0,0,.45) }
.qz-cat { pointer-events:none }
.qz-catimg { position:absolute; display:block; height:auto; opacity:0; transform-origin:50% 100%; filter:drop-shadow(0 12px 22px rgba(0,0,0,.4)) }
.qz-catshadow { position:absolute; height:46px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.5), transparent); opacity:0 }
.qz-spark { position:absolute; width:70px; height:70px; margin:-35px 0 0 -35px; opacity:0 }
.qz-z { position:absolute; font-size:60px; line-height:1; color:var(--second); opacity:0; text-shadow:0 3px 10px rgba(0,0,0,.4) }
</style>
</head>
<body>
<div id="wrap"><div id="frame"><div id="stage"></div>
  <div id="guides" aria-hidden="true"><svg viewBox="0 0 1080 1920">
    <defs><pattern id="tg-hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="22" fill="rgba(255,255,255,.10)"/></pattern></defs>
    <!-- status bar and tabs -->
    <rect x="0" y="0" width="1080" height="250" fill="rgba(0,0,0,.22)"/>
    <text x="150" y="82" class="gt b">13:26</text>

    <rect x="878" y="50" width="62" height="30" rx="9" fill="none" stroke="#fff" stroke-width="3"/><rect x="883" y="55" width="44" height="20" rx="5" fill="#fff"/>
    <text x="116" y="214" class="gt s b">LIVE</text><text x="327" y="216" class="gt m">Community</text><text x="578" y="216" class="gt m">Following</text>
    <text x="789" y="216" class="gt b">For You</text><rect x="758" y="236" width="62" height="6" rx="3" fill="#fff"/>
    <circle cx="950" cy="196" r="19" fill="none" stroke="#fff" stroke-width="5"/><path d="M964 210l16 16" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

    <circle cx="953" cy="918" r="50" fill="#d9d9d9" stroke="#fff" stroke-width="4"/>

    <circle cx="953" cy="1093" r="33" fill="#fe2c55"/><text x="953" y="1165" class="gt n">408</text>

    <circle cx="953" cy="1413" r="33" fill="#FFC21A"/><text x="953" y="1485" class="gt n">67</text>

    <circle cx="953" cy="1751" r="44" fill="#3a3a3a" stroke="#999" stroke-width="10"/>
    <!-- caption and search bar -->
    <text x="77" y="1550" class="gt l b sh">@username</text>
    <text x="77" y="1606" class="gt l sh">Can you get 3/3? Comment your score</text>
    <text x="77" y="1656" class="gt l sh">#learnchinese #hsk #mandarin … more</text>
    <rect x="0" y="1837" width="1080" height="83" fill="rgba(20,20,20,.72)"/>
    <text x="77" y="1892" class="gt l">Search · study quiz</text><text x="1000" y="1892" class="gt r">See more ›</text>
    <!-- the sides TikTok cuts off, and the part nothing covers -->
    <rect x="0" y="0" width="47" height="1920" fill="rgba(0,0,0,.72)"/><rect x="0" y="0" width="47" height="1920" fill="url(#tg-hatch)"/>
    <rect x="1027" y="0" width="53" height="1920" fill="rgba(0,0,0,.72)"/><rect x="1027" y="0" width="53" height="1920" fill="url(#tg-hatch)"/>
    <path d="M100 255H1000V850H880V1505H100Z" fill="none" stroke="#66CCFF" stroke-width="6" stroke-dasharray="20 14"/>
  </svg></div>
</div></div>
<div id="bar">
  <button id="play" type="button">Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
  <span id="time">0.0 / 0.0</span>
  <button id="snd" type="button">Sound on</button>
  <button id="guide" type="button" aria-pressed="false">TikTok guides</button>
</div>
<script>
window.QUIZ = /*QUIZDATA*/null;
</script>
<script>
(() => {
'use strict';
const Q = window.QUIZ;
// ---------- pure helpers ----------
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eob = (x, s = 1.4) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const h = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const W = 1080, H = 1920;
const stage = document.getElementById('stage');

// ---------- timeline ----------
const scenes = []; let acc = 0;
Q.items.forEach((it, i) => {
  const n = Q.count, last = i === Q.items.length - 1;
  const dur = n + Q.reveal + (last && Q.follow ? Q.outro : 0);
  scenes.push({ it, start: acc, dur, n, last }); acc += dur;
});
const DUR = acc;

// ---------- backdrop: lanterns on a night street, driven by global time ----------
// Silk colours of the lanterns, each [glowing core, silk, deep edge]: a market street of mixed lanterns.
const LANTERN_COLORS = [
  ['#FFE2B8', '#E8312F', '#7A0C12'], ['#FFE8AE', '#F57C1F', '#8A3A08'], ['#FFF8C8', '#F2C41C', '#8C6A05'],
  ['#E4FFC0', '#4DBB45', '#165C1E'], ['#CFFFF6', '#1DB2A4', '#0B5550'], ['#D6EEFF', '#2F7BEA', '#122F7A'],
  ['#F0DCFF', '#8C48D9', '#3B1670'], ['#FFDDEE', '#E2559A', '#7A1648'], ['#FFFFFF', '#F4E7CF', '#A08A64'],
];
// one lantern: r = radius, L = where its cap hangs, c = colour index, shape = round | tall | onion (pointed ends)
function lantern(r, L, c, shape) {
  const rx = shape === 'tall' ? r * 0.8 : r, hh = shape === 'tall' ? r * 1.42 : shape === 'onion' ? r * 1.05 : r * 1.12;
  const cy = L + r * 0.2 + hh, bot = cy + hh, sw = Math.max(1.5, r * 0.025), f = v => v.toFixed(1), col = LANTERN_COLORS[c];
  const body = k => (shape === 'onion'
    ? '<path d="M0 ' + f(cy - hh) + ' C' + f(rx * 1.34 * k) + ' ' + f(cy - hh * 0.6) + ' ' + f(rx * 1.34 * k) + ' ' + f(cy + hh * 0.6) + ' 0 ' + f(cy + hh) +
      ' C' + f(-rx * 1.34 * k) + ' ' + f(cy + hh * 0.6) + ' ' + f(-rx * 1.34 * k) + ' ' + f(cy - hh * 0.6) + ' 0 ' + f(cy - hh) + 'Z"'
    : '<ellipse cx="0" cy="' + f(cy) + '" rx="' + f(rx * k) + '" ry="' + f(hh) + '"');
  let s = '<g><circle class="halo" cx="0" cy="' + f(cy) + '" r="' + f(r * 2.1) + '" fill="url(#lt-glow-' + c + ')"/>';
  s += '<path d="M0 -40 V' + f(L + 2) + '" style="stroke:var(--cap);stroke-width:' + f(Math.max(2, r * 0.04)) + '"/>';
  s += '<rect x="' + f(-r * 0.46) + '" y="' + f(L) + '" width="' + f(r * 0.92) + '" height="' + f(r * 0.26) + '" rx="' + f(r * 0.06) + '" style="fill:var(--cap)"/>';
  s += body(1) + ' fill="url(#lt-body-' + c + ')"/>';
  s += [0.34, 0.66, 0.9].map(k => body(k) + ' style="fill:none;stroke:' + col[2] + ';stroke-width:' + f(sw) + ';opacity:.45"/>').join('');
  s += '<path d="M' + f(-rx * 0.62) + ' ' + f(cy - hh * 0.62) + ' Q' + f(-rx * 0.98) + ' ' + f(cy) + ' ' + f(-rx * 0.62) + ' ' + f(cy + hh * 0.62) + '" style="fill:none;stroke:#fff;stroke-width:' + f(r * 0.07) + ';stroke-linecap:round;opacity:.25"/>';
  s += '<rect x="' + f(-r * 0.4) + '" y="' + f(bot - r * 0.2) + '" width="' + f(r * 0.8) + '" height="' + f(r * 0.24) + '" rx="' + f(r * 0.06) + '" style="fill:var(--cap)"/>';
  s += '<path d="M' + f(-r * 0.12) + ' ' + f(bot + r * 0.04) + ' L' + f(-r * 0.2) + ' ' + f(bot + r * 0.95) + ' H' + f(r * 0.2) + ' L' + f(r * 0.12) + ' ' + f(bot + r * 0.04) + ' Z" style="fill:' + col[1] + ';opacity:.85"/>';
  return s + '</g>';
}
function backdrop() {
  const r = rng(7), rc = rng(11), all = [];
  const defs = '<defs>' + LANTERN_COLORS.map((c, i) =>
    '<radialGradient id="lt-body-' + i + '" cx=".4" cy=".42" r=".65"><stop offset="0" stop-color="' + c[0] + '"/><stop offset=".45" stop-color="' + c[1] + '"/><stop offset="1" stop-color="' + c[2] + '"/></radialGradient>' +
    '<radialGradient id="lt-glow-' + i + '"><stop offset="0" stop-color="' + c[1] + '" stop-opacity=".38"/><stop offset="1" stop-color="' + c[1] + '" stop-opacity="0"/></radialGradient>').join('') + '</defs>';
  // colours and shapes come from their own seeded sequence, so the lanterns' positions stay as they were
  let lastC = -1;
  const look = () => { let c = Math.floor(rc() * LANTERN_COLORS.length); if (c === lastC) c = (c + 1) % LANTERN_COLORS.length; lastC = c; return [c, ['round', 'onion', 'tall'][Math.floor(rc() * 3)]]; };
  const hang = (x, R, L) => { all.push({ x, f: 0.55 + r() * 0.5, ph: r() * 6.28, a: 1.5 + r() * 2.5 }); const [c, shape] = look(); return '<g class="hang" transform="translate(' + x.toFixed(0) + ' -20)">' + lantern(R, L, c, shape) + '</g>'; };
  let far = '<svg class="art bd-far" viewBox="0 0 ' + W + ' ' + H + '" style="opacity:.45">' + defs;
  for (let i = 0; i < 12; i++) { const R = 32 + r() * 28; far += hang((i + 0.15 + r() * 0.7) / 12 * W, R, 60 + r() * H * 0.8); }
  far += '</svg>';
  let mid = '<svg class="art bd-mid" viewBox="0 0 ' + W + ' ' + H + '" style="opacity:.8">';
  for (let i = 0; i < 6; i++) { const R = 80 + r() * 50; mid += hang((i + 0.2 + r() * 0.6) / 6 * W, R, 120 + r() * H * 0.7); }
  mid += '</svg>';
  let near = '<svg class="art bd-near" viewBox="0 0 ' + W + ' ' + H + '">';
  [[-30, 1000, 250], [1110, 700, 220], [600, 1480, 290]].forEach(([x, top, R]) => { near += hang(x, R, top); });
  near += '</svg>';
  const el = h('<div class="layer"><div class="qz-air"></div>' + far + mid + near + '<div class="qz-vignette"></div></div>');
  const hangs = Array.from(el.querySelectorAll('.hang')), halos = Array.from(el.querySelectorAll('.halo'));
  const layers = ['.bd-far', '.bd-mid', '.bd-near'].map(s => el.querySelector(s));
  return { el, render(T) {
    hangs.forEach((g, i) => {
      const q = all[i];
      g.setAttribute('transform', 'translate(' + q.x.toFixed(1) + ' -20) rotate(' + (q.a * Math.sin(T * q.f + q.ph)).toFixed(2) + ')');
      halos[i].style.opacity = (0.8 + 0.2 * Math.sin(T * 1.3 + q.ph * 2)).toFixed(3);
    });
    layers[0].style.transform = 'translateX(' + (6 * Math.sin(T * 0.2)).toFixed(1) + 'px)';
    layers[1].style.transform = 'translateX(' + (14 * Math.sin(T * 0.2 + 0.5)).toFixed(1) + 'px)';
    layers[2].style.transform = 'translate(' + (30 * Math.sin(T * 0.2 + 1)).toFixed(1) + 'px,' + (10 * Math.sin(T * 0.3)).toFixed(1) + 'px)';
  } };
}

// ---------- countdown badge ----------
function badge() {
  const C = 2 * Math.PI * 74;
  const el = h('<div class="qz-badge"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="80" style="fill:var(--badge)"/><circle class="ring" cx="85" cy="85" r="74" transform="rotate(-90 85 85)" style="fill:none;stroke:var(--main);stroke-width:9;stroke-linecap:round;stroke-dasharray:' + C.toFixed(1) + '"/></svg><div class="qz-num">0</div></div>');
  const ring = el.querySelector('.ring'), num = el.querySelector('.qz-num');
  return { el, render(t, n) {
    num.textContent = String(t < n ? n - Math.floor(Math.max(0, t)) : 0);
    const f = t < 0 ? 1 : (t < n ? t - Math.floor(t) : t - n);
    num.style.transform = 'scale(' + (1 + 0.18 * (1 - eo(seg(f, 0, 0.35)))).toFixed(3) + ')';
    if (t < n) { ring.style.strokeDashoffset = (C * clamp01(t / n)).toFixed(1); ring.style.stroke = 'var(--main)'; }
    else { ring.style.strokeDashoffset = (C * (1 - eo(seg(t, n, n + 0.5)))).toFixed(1); ring.style.stroke = 'var(--accent)'; }
    el.style.transform = 'scale(' + (1 + 0.015 * Math.sin(t * 2.1)).toFixed(4) + ')';
  } };
}

const enter = (el, t, t0, dy) => { const q = eo(seg(t, t0, t0 + 0.45)); el.style.opacity = q.toFixed(3); return (1 - q) * (dy || 40); };

// ---------- follow card ----------
function follow() {
  const el = h('<div class="qz-follow"><div class="qz-followtxt">' + esc(Q.followText) + '</div>' + (Q.logo ? '<img class="qz-logo" alt="" src="' + Q.logo + '">' : '') + '</div>');
  const txt = el.querySelector('.qz-followtxt'), logo = el.querySelector('.qz-logo');
  return { el, render(t, t0) {
    const a = eo(seg(t, t0, t0 + 0.5)), b = eob(seg(t, t0 + 0.2, t0 + 0.8), 1.7);
    el.style.opacity = a.toFixed(3);
    txt.style.transform = 'translateY(' + ((1 - a) * 90).toFixed(1) + 'px)';
    if (logo) logo.style.transform = 'rotate(' + lerp(-120, 0, b).toFixed(1) + 'deg) scale(' + lerp(0.4, 1, b).toFixed(3) + ')';
  } };
}

// ---------- quiz type "kepes": English word -> characters in a practice grid -> pinyin card ----------
function charQuiz(sc) {
  const it = sc.it, chars = Array.from(it.han), cs = Math.min(380, Math.floor(740 / chars.length));
  const cells = chars.map(ch => '<div class="qz-cell" style="width:' + cs + 'px;height:' + cs + 'px"><svg viewBox="0 0 400 400"><rect x="2" y="2" width="396" height="396" style="fill:none;stroke:var(--ink);stroke-width:4;opacity:.6"/><path d="M200 2V398M2 200H398" style="fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:14 12;opacity:.45"/></svg><div class="qz-han" style="font-size:' + Math.round(cs * 0.83) + 'px">' + esc(ch) + '</div></div>').join('');
  const el = h('<div class="qz-ui"><div class="qz-col"><div class="qz-bubble">' + esc(Q.question) + '</div><div class="qz-word">' + esc(it.en) + '</div><div class="qz-card"><div class="qz-grid">' + cells + '</div><div class="qz-popwrap"><div class="qz-pop"><div class="qz-pophan">' + esc(it.han) + '</div><div class="qz-poppin">(' + esc(it.pinyin) + ')</div><svg class="qz-under" viewBox="0 0 400 30"><path class="under" d="M10 18 Q120 6 200 16 T390 12" style="fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:420"/></svg></div></div></div></div></div>');
  const q = s => el.querySelector(s);
  const p = { bubble: q('.qz-bubble'), word: q('.qz-word'), card: q('.qz-card'), grid: q('.qz-grid'), pop: q('.qz-pop'), under: q('.under'), hans: Array.from(el.querySelectorAll('.qz-han')) };
  return { el, render(t) {
    const e = sc.start === 0 ? -1.4 : 0, n = sc.n;
    p.bubble.style.transform = 'translateY(' + enter(p.bubble, t, e, 50).toFixed(1) + 'px) scale(' + (1 + 0.006 * Math.sin(t * 2.1)).toFixed(4) + ')';
    p.word.style.transform = 'translateY(' + enter(p.word, t, e + 0.12, 30).toFixed(1) + 'px)';
    p.card.style.transform = 'translateY(' + enter(p.card, t, e + 0.22, 60).toFixed(1) + 'px)';
    p.hans.forEach((hn, i) => {
      const k = eob(seg(t, e + 0.35 + i * 0.15, e + 0.85 + i * 0.15), 1.6);
      hn.style.opacity = clamp01(k * 1.5).toFixed(3);
      hn.style.transform = 'scale(' + lerp(0.7, 1, k).toFixed(3) + ') rotate(' + (0.6 * Math.sin(t * 1.4 + i)).toFixed(2) + 'deg)';
    });
    const rp = eob(seg(t, n, n + 0.45), 1.7), ro = eo(seg(t, n, n + 0.22));
    p.pop.style.opacity = ro.toFixed(3);
    p.pop.style.transform = 'translateY(' + (3 * Math.sin(t * 1.7)).toFixed(1) + 'px) scale(' + lerp(0.6, 1, rp).toFixed(3) + ')';
    p.under.style.strokeDashoffset = (420 * (1 - eo(seg(t, n + 0.4, n + 0.9)))).toFixed(1);
    p.grid.style.opacity = lerp(1, 0.8, ro).toFixed(3);
  } };
}

// ---------- quiz type "szoveges": question, three answers, right one turns green ----------
function mcQuiz(sc) {
  const it = sc.it;
  const answers = it.options.map((o, i) => '<div class="qz-ans"><div class="qz-fill"></div><span class="qz-anstxt">' + esc(o.han) + ' (' + esc(o.pinyin) + ')</span>' + (i === it.correct ? '<svg class="qz-check" viewBox="0 0 64 64"><path class="tick" d="M12 34 L27 48 L53 18" style="fill:none;stroke:var(--second);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70"/></svg>' : '') + '</div>').join('');
  const qtext = Q.question.replace('{en}', it.en);
  const el = h('<div class="qz-ui"><div class="qz-col"><div class="qz-bubble">' + esc(qtext) + '</div><div class="qz-answers">' + answers + '</div></div></div>');
  const bubble = el.querySelector('.qz-bubble'), tick = el.querySelector('.tick');
  const ans = Array.from(el.querySelectorAll('.qz-ans')).map(a => ({ el: a, fill: a.querySelector('.qz-fill') }));
  return { el, render(t) {
    const e = sc.start === 0 ? -1.4 : 0, n = sc.n;
    bubble.style.transform = 'translateY(' + enter(bubble, t, e, 50).toFixed(1) + 'px) scale(' + (1 + 0.006 * Math.sin(t * 2.1)).toFixed(4) + ')';
    const hit = eo(seg(t, n, n + 0.35)), grow = eob(seg(t, n, n + 0.5), 1.8);
    ans.forEach((a, i) => {
      const dy = enter(a.el, t, e + 0.25 + i * 0.14, 50), right = i === it.correct;
      const op = eo(seg(t, e + 0.25 + i * 0.14, e + 0.7 + i * 0.14));
      a.el.style.opacity = (right ? op : op * lerp(1, 0.5, hit)).toFixed(3);
      a.fill.style.opacity = right ? hit.toFixed(3) : '0';
      a.el.style.transform = 'translateY(' + dy.toFixed(1) + 'px) scale(' + (right ? 1 + 0.02 * grow : 1).toFixed(4) + ')';
    });
    if (tick) tick.style.strokeDashoffset = (70 * (1 - eo(seg(t, n + 0.25, n + 0.6)))).toFixed(1);
  } };
}

// ---------- the cat: photo cut-outs, posed and moved by time only ----------
// Poses (all optional): peek = looking over an edge (flat bottom), look = lying, looking up (flat left edge),
// sit = sitting, sleep = curled up. During a question the cat peeks (even questions) or looks up from the left
// (odd ones); at the reveal it crouches and jumps in sitting; after the last question it falls asleep.
function catView() {
  if (!Q.cat) return null;
  const z = Q.kind === 'szoveges' ? 1.2 : 1;  // the text quiz leaves more room at the bottom
  const POSE = {
    peek:  { w: 470 * z, left: 40,  bottom: 0 },
    look:  { w: 520 * z, left: -16, bottom: 26 },
    sit:   { w: 372 * z, left: 64,  bottom: 30 },
    sleep: { w: 560 * z, left: (W - 560 * z) / 2, bottom: 36 },
  };
  const el = h('<div class="layer qz-cat"></div>'), img = {};
  const shadow = h('<div class="qz-catshadow"></div>'); el.append(shadow);
  Object.keys(POSE).forEach(k => {
    if (!Q.cat[k]) return;
    const p = POSE[k], im = document.createElement('img');
    im.className = 'qz-catimg'; im.alt = ''; im.src = Q.cat[k];
    im.style.width = p.w.toFixed(0) + 'px'; im.style.left = p.left.toFixed(0) + 'px'; im.style.bottom = p.bottom + 'px';
    el.append(im); img[k] = im;
  });
  const star = '<svg viewBox="-50 -50 100 100"><path d="M0-48 C6-12 12-6 48 0 C12 6 6 12 0 48 C-6 12-12 6-48 0 C-12-6-6-12 0-48Z" style="fill:#FFE8A3"/></svg>';
  const sparks = [[-150, -40, 0], [130, -110, 0.12], [190, 40, 0.24]].map(([dx, dy, d]) => {
    const s = h('<div class="qz-spark">' + star + '</div>'); el.append(s); return { s, dx, dy, d };
  });
  const zs = ['z', 'z', 'Z'].map(c => { const e = h('<div class="qz-z">' + c + '</div>'); el.append(e); return e; });
  const pick = (...ks) => ks.find(k => img[k]);  // first pose that exists
  const qPoses = [pick('peek', 'look', 'sit'), pick('look', 'peek', 'sit')];
  const put = (k, o) => {
    const im = img[k]; if (!im) return;
    im.style.opacity = clamp01(o.op).toFixed(3);
    im.style.transform = 'translate(' + (o.x || 0).toFixed(1) + 'px,' + (o.y || 0).toFixed(1) + 'px) rotate(' + (o.rot || 0).toFixed(2) +
      'deg) scale(' + (o.sx || 1).toFixed(3) + ',' + (o.sy || 1).toFixed(3) + ')';
  };
  const headOf = k => { const p = POSE[k]; return { x: p.left + p.w * 0.7, y: H - p.bottom - p.w * 1.0 }; };
  // wait for the load event, not img.decode(): decode() can stay pending while the page is in the background
  const loaded = im => (im.complete ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; }));
  return { el, ready: Promise.all(Object.values(img).map(loaded)), render(sc, i, t) {
    Object.values(img).forEach(im => { im.style.opacity = '0'; });
    sparks.forEach(o => { o.s.style.opacity = '0'; });
    zs.forEach(e => { e.style.opacity = '0'; });
    shadow.style.opacity = '0';
    const e = sc.start === 0 ? -1.4 : 0, n = sc.n, q = qPoses[i % 2];
    if (t < n + 0.15) {
      // question: come in, watch with a slow bob, crouch just before the answer, then duck away
      const k = eob(seg(t, e + 0.3, e + 1.0), 1.5), c = seg(t, n - 0.2, n), d = eo(seg(t, n, n + 0.15));
      const o = { op: 1 - d, rot: 1.4 * Math.sin(t * 1.3), sx: 1 + 0.05 * c, sy: 1 - 0.08 * c };
      if (q === 'look') { o.x = -(1 - k) * POSE.look.w * 1.1; o.y = 4 * Math.sin(t * 1.8) + d * 260; }
      else { o.y = (1 - k) * POSE[q].w + 6 * Math.sin(t * 2.2) + d * 300; }
      put(q, o);
    }
    if (t >= n) {
      const r = t - n, outro = sc.last && Q.follow ? t - (n + Q.reveal) : -1;
      // jump in sitting: up from below, an arc, a squash on landing, then a gentle bob
      const k = seg(r, 0.05, 0.6), land = Math.sin(Math.PI * seg(r, 0.6, 0.85)), air = Math.sin(Math.PI * k);
      const away = outro >= 0 ? eo(seg(outro, 0, 0.35)) : 0;
      const y = lerp(320, 0, k) - 300 * 4 * k * (1 - k) + (r > 0.85 ? 4 * Math.sin(t * 2.4) : 0) + away * 520;
      const sk = pick('sit', 'peek', 'look');
      put(sk, { op: (r > 0.05 ? 1 : 0) * (1 - away), y, sx: 1 - 0.04 * air + 0.08 * land, sy: 1 + 0.07 * air - 0.12 * land, rot: -3 * air });
      if (sk === 'sit') {
        const p = POSE.sit; shadow.style.left = (p.left + p.w * 0.12).toFixed(0) + 'px'; shadow.style.width = (p.w * 0.8).toFixed(0) + 'px';
        shadow.style.top = (H - p.bottom - 26).toFixed(0) + 'px';
        shadow.style.opacity = (seg(r, 0.3, 0.6) * (1 - 0.6 * air) * (1 - away)).toFixed(3);
        shadow.style.transform = 'scaleX(' + (1 - 0.4 * air).toFixed(3) + ')';
      }
      const hd = headOf(sk);
      sparks.forEach(o => {
        const f = seg(r, 0.55 + o.d, 1.25 + o.d), s = Math.sin(Math.PI * f);
        o.s.style.left = (hd.x + o.dx).toFixed(0) + 'px'; o.s.style.top = (hd.y + o.dy).toFixed(0) + 'px';
        o.s.style.opacity = (s * (1 - away)).toFixed(3); o.s.style.transform = 'scale(' + (0.3 + 0.9 * s).toFixed(3) + ') rotate(' + (90 * f).toFixed(1) + 'deg)';
      });
      if (outro >= 0 && img.sleep) {
        // after the last answer: curl up and sleep, breathing, with z's floating up
        const a = eob(seg(outro, 0.15, 0.7), 1.3), p = POSE.sleep;
        put('sleep', { op: eo(seg(outro, 0.15, 0.45)), y: (1 - a) * 160, sx: 1 + 0.012 * Math.sin(t * 2.6), sy: 1 + 0.02 * Math.sin(t * 2.6) });
        zs.forEach((ze, j) => {
          const ph = ((outro - 0.6) * 0.8 + j / 3) % 1;
          if (outro < 0.6 + j * 0.42) return;
          ze.style.left = (p.left + p.w * 0.78 + ph * 60 + j * 14).toFixed(0) + 'px';
          ze.style.top = (H - p.bottom - p.w * 0.62 * 0.62 - ph * 150).toFixed(0) + 'px';
          ze.style.opacity = Math.sin(Math.PI * ph).toFixed(3);
          ze.style.transform = 'scale(' + (0.6 + 0.6 * ph).toFixed(3) + ') rotate(' + (-12 + 10 * ph).toFixed(1) + 'deg)';
        });
      }
    }
  } };
}

// ---------- build ----------
// a background photo (config.json "backgrounds") replaces the drawn lantern street
function photoBackdrop() {
  const el = h('<div class="layer"><img class="qz-photo" alt="" src="' + Q.background + '"><div class="qz-shade"></div><div class="qz-vignette"></div></div>');
  const img = el.querySelector('.qz-photo');
  stage.classList.add('photo');
  const ready = img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; });
  return { el, ready, render(T) {
    // a slow zoom and drift over the whole video
    const p = T / DUR;
    img.style.transform = 'translate(' + (18 * Math.sin(T * 0.11)).toFixed(1) + 'px,' + (-40 * p).toFixed(1) + 'px) scale(' + (1.06 + 0.07 * p).toFixed(4) + ')';
  } };
}
const bd = Q.background ? photoBackdrop() : backdrop(); stage.append(bd.el);
const group = h('<div class="qz-group"></div>'); stage.append(group); // the quiz, moved and shrunk as one (see .qz-group)
scenes.forEach(sc => { sc.view = Q.kind === 'kepes' ? charQuiz(sc) : mcQuiz(sc); group.append(sc.view.el); });
const cat = catView(); if (cat) group.append(cat.el);
const bg = badge(); group.append(bg.el);
const fw = Q.follow ? follow() : null; if (fw) group.append(fw.el);
let current = null;

function renderAt(T) {
  T = Math.max(0, Math.min(DUR - 1e-6, T));
  bd.render(T);
  let sc = scenes[scenes.length - 1];
  for (const s of scenes) if (T < s.start + s.dur) { sc = s; break; }
  if (current !== sc) { if (current) current.view.el.style.display = 'none'; sc.view.el.style.display = 'block'; current = sc; }
  const t = T - sc.start;
  sc.view.render(t);
  if (cat) cat.render(sc, scenes.indexOf(sc), t);
  bg.render(t, sc.n);
  if (fw) { if (sc.last) fw.render(t, sc.n + 0.6); else fw.el.style.opacity = '0'; }
}
window.DURATION = DUR;
window.renderAt = renderAt;

// ---------- sound: synthesized, same events live and offline ----------
const mid = m => 440 * Math.pow(2, (m - 69) / 12);
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const nm = s => { const m = /^([A-G])(#?)(\d)$/.exec(s); return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0); };
function score() {
  const ev = [], add = (t, k, o) => ev.push(Object.assign({ t, k }, o || {}));
  const chords = [['D3', 'A3', 'E4'], ['B2', 'F#3', 'D4'], ['G2', 'D3', 'B3'], ['A2', 'E3', 'C#4']];
  const roots = ['D2', 'B1', 'G1', 'A1'];
  const mel = [['D4', 'F#4', 'A4', 'B4'], ['B3', 'D4', 'F#4', 'A4'], ['G4', 'A4', 'B4', 'D5'], ['A4', 'B4', 'D5', 'E5']];
  const pat = 'x.x.X.xx';
  scenes.forEach((sc, i) => {
    const t0 = sc.start, c = i % 4, len = sc.n + Q.reveal;
    add(t0, 'whoosh');
    add(t0, 'pad', { notes: chords[c], dur: sc.dur });
    for (let b = 0; b < len * 2; b++) {
      const s = pat[b % 8]; if (s !== '.') add(t0 + b * 0.25, 'pluck', { note: mel[c][b % 4], vel: s === 'X' ? 0.9 : 0.6 });
      if (b % 4 === 0) add(t0 + b * 0.25, 'bass', { note: roots[c] });
    }
    if (Q.kind === 'szoveges' && !sc.last) for (let b = 0; b < len * 2; b += 2) { add(t0 + b * 0.25, b % 4 === 0 ? 'kick' : 'hat'); }
    for (let x = 0; x < sc.n; x += 0.5) add(t0 + x, 'tick');
    add(t0 + sc.n, Q.kind === 'kepes' ? 'ding' : 'chime');
    if (sc.last && Q.follow) { add(t0 + sc.n + 1.2, 'pop'); add(t0 + sc.n + 1.2, 'pad', { notes: ['D3', 'A3', 'F#4', 'E5'], dur: sc.dur - sc.n - 1.2 }); }
  });
  return ev;
}
const EVENTS = score();

// ---------- the spoken clips (Google TTS, made by tts/make_audio.py, embedded by quiz_gen.py) ----------
// Each card: its question shortly after it appears (the picture quiz has one fixed question), and the word in
// Mandarin right after the reveal. Decoded once; the same buffers play live and in the offline render.
const VOICE = Q.voice || null, VOICE_BUF = {}, VOICE_EVENTS = [];
if (VOICE) scenes.forEach((sc, i) => {
  VOICE_EVENTS.push({ t: sc.start + (i === 0 ? 0.35 : 0.3), k: Q.kind === 'kepes' ? 'question' : 'q' + i });
  VOICE_EVENTS.push({ t: sc.start + sc.n + 0.45, k: 'zh' + i });
});
const VOICE_READY = (async () => {
  if (!VOICE) return;
  const dec = new OfflineAudioContext(1, 1, 44100), jobs = [];
  if (VOICE.question) jobs.push(['question', VOICE.question]);
  VOICE.items.forEach((v, i) => { if (v.q) jobs.push(['q' + i, v.q]); if (v.zh) jobs.push(['zh' + i, v.zh]); });
  for (const [k, uri] of jobs) {
    const bin = atob(uri.slice(uri.indexOf(',') + 1)), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    try { VOICE_BUF[k] = await dec.decodeAudioData(bytes.buffer); } catch (e) { console.warn('voice clip ' + k + ' could not be decoded', e); }
  }
})();

function synth(ctx, from, at) {
  // from: film time to start at; at: context time that equals `from`
  const master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
  const endAt = at + (DUR - from);
  master.gain.setValueAtTime(0.55, Math.max(at, endAt - 1.4)); master.gain.linearRampToValueAtTime(0, endAt);
  // the music goes through `out`, which dips while a voice speaks; the voices go straight to the master
  const out = ctx.createGain(); out.gain.value = 1; out.connect(master);
  const voice = ctx.createGain(); voice.gain.value = 1.5; voice.connect(master);
  for (const v of VOICE_EVENTS) {
    const buf = VOICE_BUF[v.k];
    if (!buf || v.t < from - 0.01) continue;
    const t = at + (v.t - from), src = ctx.createBufferSource();
    src.buffer = buf; src.connect(voice); src.start(t);
    out.gain.setTargetAtTime(0.35, Math.max(at, t - 0.12), 0.05);
    out.gain.setTargetAtTime(1, t + buf.duration, 0.15);
  }
  const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = nb.getChannelData(0), nr = rng(3);
  for (let i = 0; i < nd.length; i++) nd[i] = nr() * 2 - 1;
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const osc = (type, f, t, a, peak, d, dest) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f; env(g, t, a, peak, d); o.connect(g).connect(dest || out); o.start(t); o.stop(t + a + d + 0.05); return o; };
  const noise = (t, d, peak, ftype, f, f2) => { const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = nb; fl.type = ftype; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d); env(g, t, Math.min(0.01, d / 4), peak, d); s.connect(fl).connect(g).connect(out); s.start(t); s.stop(t + d + 0.05); };
  for (const e of EVENTS) {
    if (e.t < from - 0.01) continue;
    const t = at + (e.t - from);
    switch (e.k) {
      case 'tick': osc('square', 1800, t, 0.002, 0.05, 0.03); break;
      case 'ding': osc('sine', 1318.5, t, 0.005, 0.32, 1.2); osc('sine', 2637, t, 0.005, 0.1, 0.6); break;
      case 'chime': [1046.5, 1318.5, 1568].forEach((f, i) => osc('sine', f, t + i * 0.06, 0.005, 0.22, 1.0)); osc('sine', 2093, t + 0.25, 0.005, 0.08, 0.8); break;
      case 'pop': osc('sine', 660, t, 0.003, 0.3, 0.12).frequency.exponentialRampToValueAtTime(1300, t + 0.1); break;
      case 'pluck': { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2400; f.connect(out); osc('triangle', mid(nm(e.note)), t, 0.004, 0.13 * e.vel, 0.45, f); break; }
      case 'bass': osc('sine', mid(nm(e.note)), t, 0.01, 0.28, 0.5); break;
      case 'kick': { const o = osc('sine', 120, t, 0.002, 0.5, 0.25); o.frequency.exponentialRampToValueAtTime(45, t + 0.15); break; }
      case 'hat': noise(t, 0.05, 0.05, 'highpass', 7000); break;
      case 'whoosh': noise(t, 0.45, 0.06, 'bandpass', 400, 2200); break;
      case 'pad': {
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; f.connect(out);

// ---------- player ----------
const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
const frame = document.getElementById('frame'), wrap = document.getElementById('wrap');
function fit() {
  // a narrow player puts its buttons on a second row; the picture area ends where the bar starts
  wrap.style.bottom = (capture ? 0 : document.getElementById('bar').offsetHeight) + 'px';
  const s = capture ? 1 : Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  frame.style.width = W * s + 'px'; frame.style.height = H * s + 'px';
  stage.style.transformOrigin = '0 0'; stage.style.transform = 'scale(' + s + ')';
  document.getElementById('guides').style.transform = 'scale(' + s + ')';

window.addEventListener('resize', fit); fit();
window.fit = fit; // the quiz page calls it after resizing the preview
let T = 0, playing = false, t0 = 0, p0 = 0, ac = null, soundOn = true;
const playBtn = document.getElementById('play'), seek = document.getElementById('seek'), time = document.getElementById('time'), snd = document.getElementById('snd');
const show = () => { renderAt(T); seek.value = Math.round(T / DUR * 1000); time.textContent = T.toFixed(1) + ' / ' + DUR.toFixed(1); };
const stopAudio = () => { if (ac) { ac.close(); ac = null; } };
// An iPhone mutes web-page sound while its ring/silent switch is on silent, unless the page plays like a media
// player ("playback", Safari 17 and later). The downloaded video plays with sound either way.
const asPlayer = () => { try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* older browser */ } };
const startAudio = () => { stopAudio(); if (!soundOn) return; asPlayer(); ac = new AudioContext(); synth(ac, T, ac.currentTime + 0.05); };

playBtn.onclick = () => (playing ? pause() : play());
seek.oninput = () => { T = seek.value / 1000 * DUR; if (playing) { p0 = T; t0 = performance.now(); startAudio(); } show(); };
snd.onclick = () => { soundOn = !soundOn; snd.textContent = soundOn ? 'Sound on' : 'Sound off'; if (playing) startAudio(); };
document.getElementById('guide').onclick = e => { const on = document.body.classList.toggle('guides'); e.currentTarget.setAttribute('aria-pressed', String(on)); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
show();
// ---------- answer bands: a shade of the background that stands out from it ----------
// The bands behind the answers (and the follow text) take the background's hue at a clearly different lightness:
// lighter on a dark background, darker on a bright one, always dark enough for the white text (CIE L* at most 46,
// contrast at least about 5:1).

// the average colour behind the answers (x 15-85 %, y 25-63 % of the frame), photo darkened by .qz-shade (about a third)
function behindAnswers() {
  const img = stage.querySelector('.qz-photo');
  if (!img || !img.naturalWidth) return [0x2A, 0x03, 0x06]; // the drawn lantern street: about its ground colour
  const W = 54, H = 96, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true }), k = Math.max(W / img.naturalWidth, H / img.naturalHeight); // object-fit: cover
  x.drawImage(img, (W - img.naturalWidth * k) / 2, (H - img.naturalHeight * k) / 2, img.naturalWidth * k, img.naturalHeight * k);
  const d = x.getImageData(8, 24, 38, 37).data, sum = [0, 0, 0];
  for (let i = 0; i < d.length; i += 4) for (let j = 0; j < 3; j++) sum[j] += toLin(d[i + j]);
  const n = d.length / 4, shade = [12, 2, 4].map(toLin), a = 0.32;

  for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (lstar(hslToRgb(h, s, m)) < target) lo = m; else hi = m; }
  const band = hslToRgb(h, s, lo);

  stage.style.setProperty('--bandline', target > L ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.10)');
  window.BANDS = { behind: bg, behindL: Math.round(L), band, bandL: Math.round(lstar(band)) }; // for checking

// The quiz group (layout "B"): 86 % of its size, centred across the frame, its top (the badge or, if higher, a
// question) at y 264, 18 px under TikTok's tabs. The bubble (x 72-918) spans x 176-904, above TikTok's buttons; the
// card, the answers and the follow card (x 100-890) span x 200-880, 20 px left of the buttons; the follow card ends
// near y 1500, above the caption; a taller quiz is made smaller to end at GROUP_BOTTOM. Measured with the fonts loaded.
const GROUP_SCALE = 0.86, GROUP_TOP = 264, GROUP_BOTTOM = 1505;
function placeGroup() {
  let top = bg.el.offsetTop, bottom = 0, lastBottom = 0;
  scenes.forEach((sc, i) => {
    const el = sc.view.el, was = el.style.display, col = el.querySelector('.qz-col');
    el.style.display = 'block';
    const b = col.offsetTop + col.offsetHeight;
    top = Math.min(top, col.offsetTop); bottom = Math.max(bottom, b);
    if (i === scenes.length - 1) lastBottom = b;

    bottom = Math.max(bottom, lastBottom + 34 + fw.el.offsetHeight);

  // end at GROUP_BOTTOM, above TikTok's caption
  const scale = Math.min(GROUP_SCALE, (GROUP_BOTTOM - GROUP_TOP) / (bottom - top));
  const cx = 495; // the middle of the column (x 72-918)
  group.style.transformOrigin = cx + 'px ' + top + 'px';

placeGroup();
