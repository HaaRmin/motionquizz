name: HSK quiz video

on:
  schedule:
    - cron: "17 6 * * *"   # minden nap 06:17 UTC (télen 07:17, nyáron 08:17 Budapest)
  workflow_dispatch:
    inputs:
      kinds:
        description: "Melyik kvíz(ek)"
        type: choice
        options: ["kepes szoveges", kepes, szoveges]
        default: "kepes szoveges"
      level:
        description: "HSK szint: 1, 2 vagy 1,2"
        type: string
        default: "1"
      send:
        description: "Email küldése"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hsk-quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KINDS: ${{ inputs.kinds || 'kepes szoveges' }}
      LEVEL: ${{ inputs.level || vars.QUIZ_LEVEL || '1' }}
      SEND: ${{ github.event_name == 'schedule' || inputs.send }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, Chinese fonts, emoji)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji

      - name: Python packages and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate and email the quizzes
        id: gen
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          failed=0
          for KIND in $KINDS; do
            echo "::group::$KIND"
            python quiz_gen.py "$KIND" --level "$LEVEL" --mp4 \
              --han-font /usr/share/fonts/opentype/noto/NotoSerifCJK-Black.ttc \
              --ui-font /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc || { failed=1; echo "::error::$KIND generation failed"; continue; }
            cp out/latest.json "out/latest-$KIND.json"
            if [ "$SEND" = "true" ]; then
              python send_mail.py --latest "out/latest-$KIND.json" || { failed=1; echo "::error::$KIND email failed"; }
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Save history (so the next run picks new words)
        if: ${{ always() }}
        run: |
          [ -f history.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "quiz history $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Keep the videos as a run artifact (7 days)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hsk-quiz-videos
          path: |
            out/*.mp4
            out/latest-*.json
          retention-days: 7
          if-no-files-found: ignore
